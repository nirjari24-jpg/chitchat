<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ChitChat</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="padding-top: 50px;">
        <!-- Navigation -->
        <nav style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px;">
            <h1 style="color: var(--primary-red);">ChitChat</h1>
            <div>
                <a href="/dashboard" class="btn-secondary" style="margin-right: 10px;">Back to Dashboard</a>
                <button id="logoutBtn" class="btn-primary">Logout</button>
            </div>
        </nav>

        <!-- Profile Card -->
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2 style="color: var(--primary-red); margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
                Your Profile
                <span id="profileDateJoined" style="font-size: 12px; color: var(--text-muted); font-weight: normal;"></span>
            </h2>
            
            <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 30px;">
                <div style="width: 120px; height: 120px; border-radius: 50%; overflow: hidden; border: 4px solid var(--primary-red); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(255, 45, 85, 0.3);">
                    <img id="profileAvatarImg" src="" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h3 id="profileUsernameDisplay" style="font-size: 24px; color: var(--text-main); margin-bottom: 5px;"></h3>
                <p id="profileCharacterDisplay" style="color: var(--text-muted); font-size: 14px;"></p>
            </div>
            
            <div id="successMsg" style="color: #10B981; background-color: rgba(16, 185, 129, 0.1); padding: 10px; border-radius: 6px; margin-bottom: 15px; display: none;"></div>
            <div id="errorMsg" class="error-msg"></div>

            <form id="profileForm">
                <div class="form-group">
                    <label for="profileUsername">Username (Read Only)</label>
                    <input type="text" id="profileUsername" readonly style="background-color: var(--hover-bg); cursor: not-allowed; color: var(--text-muted);">
                </div>
                <div class="form-group">
                    <label for="profileName">Real Name</label>
                    <input type="text" id="profileName" required style="text-transform: capitalize;">
                </div>
                <div class="form-group">
                    <label for="profileEmail">Email (Read Only)</label>
                    <input type="email" id="profileEmail" readonly style="background-color: var(--hover-bg); cursor: not-allowed; color: var(--text-muted);">
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%;">Update Real Name</button>
            </form>
        </div>
    </div>

    <!-- Link to JavaScript logic -->
    <script src="/js/profile.js"></script>
</body>
</html>
