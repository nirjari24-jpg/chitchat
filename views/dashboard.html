<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ChitChat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        
        <!-- Left Sidebar: User List -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>ChitChat</h2>
                <div>
                    <a href="/profile" class="btn-secondary" style="padding: 5px 10px; font-size: 12px;">Profile</a>
                    <button id="logoutBtn" class="btn-primary" style="padding: 5px 10px; font-size: 12px;">Logout</button>
                </div>
            </div>
            
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Search users...">
            </div>
            
            <div id="userList" class="user-list">
                <!-- Users will be populated here via JavaScript -->
            </div>
        </div>

        <!-- Right Side: Chat Area -->
        <div class="chat-area">
            
            <!-- Default Empty State -->
            <div id="chatEmptyState" class="chat-empty-state" style="position: relative;">
                <div style="position: absolute; top: 15px; left: 15px;">
                    <button id="mobileMenuBtnEmpty" class="mobile-menu-btn" style="display: none; color: var(--primary-red); padding: 5px 10px; background: rgba(0,0,0,0.5); border-radius: 5px; font-size: 18px;">☰ Users</button>
                </div>
                <p>Select a user to start chatting</p>
            </div>

            <!-- Active Chat Interface (Hidden by default) -->
            <div id="activeChat" style="display: none; height: 100%; flex-direction: column;">
                
                <div class="chat-header">
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <button id="mobileMenuBtn" class="mobile-menu-btn" style="display: none;">☰</button>
                        <div style="width: 45px; height: 45px; border-radius: 50%; overflow: hidden; border: 2px solid var(--primary-red); background-color: var(--card-bg);">
                            <img id="chatUserAvatar" src="" alt="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        </div>
                        <div>
                            <h3 id="chatUserName" class="fancy-name" style="margin: 0; font-size: 20px;">Select a user</h3>
                            <p id="chatUserRealName" style="margin: 0; font-size: 12px; opacity: 0.9; text-transform: capitalize;"></p>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <div id="chatOnlineStatus" style="display: none; align-items: center; gap: 5px; font-size: 14px;">
                            <span style="width: 8px; height: 8px; background-color: var(--primary-red); box-shadow: 0 0 5px var(--primary-red); border-radius: 50%; display: inline-block;"></span> Online
                        </div>
                        <button id="videoCallBtn" class="call-btn" title="Video Call">🎥</button>
                        <button id="voiceCallBtn" class="call-btn" title="Voice Call">📞</button>
                    </div>
                </div>

                <!-- Messages Container -->
                <div id="messagesContainer" class="messages-container">
                    <!-- Messages will be loaded here dynamically -->
                </div>

                <!-- Typing Indicator -->
                <div id="typingIndicator" style="display: none; padding: 5px 15px; font-size: 12px; color: var(--text-muted); font-style: italic;">
                    <span id="typingUserName">User</span> is typing...
                </div>

                <!-- Message Input Area -->
                <div class="chat-input-area" style="display: flex; gap: 10px; align-items: center; position: relative;">
                    <emoji-picker id="emojiPicker" class="dark" style="display: none; position: absolute; bottom: 100%; left: 0; z-index: 100; margin-bottom: 10px;"></emoji-picker>
                    <button id="emojiBtn" style="background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 5px;" title="Add Emoji">😀</button>
                    
                    <!-- File Attachment Input -->
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                    <button id="imageBtn" style="background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 5px;" title="Attach Image">📎</button>

                    <input type="text" id="messageInput" class="chat-input" placeholder="Type a message..." style="flex-grow: 1;">
                    <button id="sendBtn" class="btn-primary">Send</button>
                </div>
            </div>
        
    </div>

    <!-- Incoming Call Modal -->
    <div id="incomingCallModal" class="call-modal" style="display: none;">
        <div class="call-modal-content">
            <h3 id="incomingCallName">Incoming Call...</h3>
            <p id="incomingCallType">Video Call</p>
            <div class="call-actions">
                <button id="acceptCallBtn" class="btn-success">Answer</button>
                <button id="rejectCallBtn" class="btn-danger">Decline</button>
            </div>
        </div>
    </div>

    <!-- Active Call Overlay -->
    <div id="activeCallOverlay" class="call-overlay" style="display: none;">
        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button id="toggleAudioBtn" class="control-btn" title="Mute/Unmute">🎤</button>
            <button id="toggleVideoBtn" class="control-btn" title="Enable/Disable Video">📹</button>
            <button id="endCallBtn" class="control-btn btn-danger" title="End Call">End</button>
        </div>
    </div>

    <!-- Link to JavaScript logic -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.22.8/index.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/chat.js"></script>
    <script src="/js/webrtc.js"></script>
</body>
</html>
