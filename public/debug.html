<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Avatar Crop Debugger</title>
    <style>
        body {
            font-family: sans-serif;
            background: #222;
            color: #eee;
            padding: 20px;
        }
        h1 { text-align: center; }
        .grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        .card {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .crop-container {
            /* This will be the rectangle *before* border-radius 50% */
            background-color: white;
            background-image: url('/images/spritesheet.jpg');
            background-repeat: no-repeat;
            margin: 0 auto 10px auto;
            border: 1px solid #555;
            /* circular toggle */
            transition: border-radius 0.3s ease;
        }
        .crop-container.circular {
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #E62429;
        }
        .controls {
            text-align: center;
            margin-bottom: 30px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #E62429;
            color: white;
            border: none;
            border-radius: 6px;
        }
        .margin-info {
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Avatar Crop Debugger</h1>
    
    <div class="controls">
        <button id="toggleCircle">Toggle Circular Frame (border-radius: 50%)</button>
    </div>

    <div class="grid" id="grid"></div>

    <script>
        // Constants from metadata
        const imgWidth = 682;
        const imgHeight = 1024;
        const cols = 5;
        const rows = 7;
        const cellWidth = Math.floor(imgWidth / cols); // 136
        const cellHeight = Math.floor(imgHeight / rows); // 146

        // Mappings from slice_sharp_v3.js
        const mappings = {
            "ironman.jpg": { coords: [0, 0], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "captainamerica.jpg": { coords: [0, 1], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "thor.jpg": { coords: [0, 2], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "hulk.jpg": { coords: [0, 3], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "spiderman.jpg": { coords: [0, 4], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "doctorstrange.jpg": { coords: [1, 2], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "blackwidow.jpg": { coords: [1, 3], margin: { top: 15, bottom: 6, left: 6, right: 6 } },
            "loki.jpg": { coords: [1, 4], margin: { top: 20, bottom: 6, left: 6, right: 6 } },
            "groot.jpg": { coords: [2, 3], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "deadpool.jpg": { coords: [3, 0], margin: { top: 2, bottom: 20, left: 6, right: 6 } },
            "shehulk.jpg": { coords: [3, 4], margin: { top: 20, bottom: 6, left: 6, right: 6 } },
            "wonderwoman.jpg": { coords: [5, 3], margin: { top: 15, bottom: 6, left: 6, right: 6 } },
            "captainmarvel.jpg": { coords: [6, 0], margin: { top: 6, bottom: 6, left: 6, right: 6 } },
            "ladythor.jpg": { coords: [1, 1], margin: { top: 20, bottom: 6, left: 6, right: 6 } },
        };

        const grid = document.getElementById('grid');

        for (const [filename, config] of Object.entries(mappings)) {
            const [r, c] = config.coords;
            const m = config.margin;

            // Calculate exact extraction rect logic from slice_sharp_v3.js
            const leftOffset = c * cellWidth + m.left;
            const topOffset = r * cellHeight + m.top;
            const cropWidth = cellWidth - (m.left + m.right);
            const cropHeight = cellHeight - (m.top + m.bottom);

            const card = document.createElement('div');
            card.className = 'card';

            const cropEl = document.createElement('div');
            cropEl.className = 'crop-container';
            // Set dimensions of the crop box
            cropEl.style.width = cropWidth + 'px';
            cropEl.style.height = cropHeight + 'px';
            // Set background position to shift spritesheet
            cropEl.style.backgroundPosition = `-${leftOffset}px -${topOffset}px`;

            const name = document.createElement('strong');
            name.textContent = filename.replace('.jpg', '');

            const marginInfo = document.createElement('div');
            marginInfo.className = 'margin-info';
            marginInfo.textContent = `T:${m.top} B:${m.bottom}\nL:${m.left} R:${m.right}`;

            card.appendChild(cropEl);
            card.appendChild(name);
            card.appendChild(marginInfo);
            grid.appendChild(card);
        }

        // Toggle circular frame
        document.getElementById('toggleCircle').addEventListener('click', () => {
            document.querySelectorAll('.crop-container').forEach(el => {
                el.classList.toggle('circular');
            });
        });
    </script>
</body>
</html>
